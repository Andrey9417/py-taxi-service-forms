{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>

  <p>Are you sure you want to delete car: {{ car }}?</p>
  <p><i>You won't see its like again!</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{% url "taxi:car-detail" pk=car.pk %}" class="btn btn-secondary">No, I don't think so!</a>
  </form>
{% endblock %}
